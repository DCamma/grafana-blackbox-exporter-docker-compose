global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Blackbox Exporter operational metrics
  - job_name: "blackbox_exporter"
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # 3. HTTP Probes for target files in /etc/prometheus/targets/*.yml
  - job_name: "blackbox_http_targets"
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/http_targets.yml
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 4. MP4 Probes for target files in /etc/prometheus/targets/mp4_targets.yml
  - job_name: "blackbox_mp4_targets"
    metrics_path: /probe
    params:
      module: [check_mp4]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/mp4_targets.yml
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
